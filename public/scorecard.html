<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Health Scorecard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ffffff;
    --ink-soft:#e4e4e7;
    --paper:#09090b;
    --paper-dim:#18181b;
    --ledger:#22c55e;
    --ledger-soft:#16a34a;
    --gold:#22c55e;
    --gold-soft:#86efac;
    --slate:#a1a1aa;
    --red:#A8433E;
    --line: rgba(255,255,255,0.1);
    --font-display: 'Inter', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* HEADER */
  .topbar{
    background:var(--ink);
    color:#09090b;
    padding:24px 24px 18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(246,244,238,0.035) 28px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 10px;
  }
  .title{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:600;
    margin:0 0 4px;
    line-height:1.15;
  }
  .subtitle{
    font-size:14px;
    color:rgba(246,244,238,0.72);
    margin:0;
    max-width:46ch;
    line-height:1.5;
  }

  /* PROGRESS */
  .progress-row{
    display:flex;
    gap:4px;
    padding:14px 24px 0;
    background:var(--ink);
  }
  .progress-seg{
    flex:1;
    height:3px;
    background:rgba(246,244,238,0.18);
    border-radius:2px;
    overflow:hidden;
  }
  .progress-seg.done > i{width:100%;}
  .progress-seg > i{
    display:block;
    height:100%;
    width:0%;
    background:var(--gold);
    transition:width .3s ease;
  }
  .progress-label{
    padding:9px 24px 18px;
    background:var(--ink);
    font-family:var(--font-mono);
    font-size:11px;
    color:rgba(246,244,238,0.55);
    letter-spacing:0.05em;
  }

  /* SINGLE QUESTION STAGE */
  .stage{
    flex:1;
    padding:36px 24px 130px;
    display:flex;
    flex-direction:column;
  }
  .pillar-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ledger);
    background:rgba(31,77,61,0.08);
    padding:6px 12px;
    border-radius:3px;
    margin-bottom:22px;
    width:fit-content;
  }
  .pillar-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--ledger);}

  .q-number{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--gold);
    font-weight:600;
    margin-bottom:10px;
  }
  .q-label{
    font-family:var(--font-display);
    font-size:23px;
    font-weight:600;
    line-height:1.3;
    margin:0 0 14px;
  }
  .q-explain{
    font-size:14.5px;
    color:var(--slate);
    line-height:1.6;
    margin:0 0 8px;
  }
  .q-example{
    font-size:13px;
    color:var(--ledger);
    background:rgba(31,77,61,0.07);
    border-radius:6px;
    padding:10px 14px;
    margin-bottom:26px;
    line-height:1.5;
  }
  .q-example b{font-weight:600;}

  .field-area{margin-top:6px;}

  .currency-wrap{
    position:relative;
    display:flex;
    align-items:center;
  }
  .currency-wrap span{
    position:absolute;
    left:16px;
    font-family:var(--font-mono);
    font-weight:600;
    color:var(--slate);
    font-size:15px;
  }
  input[type="number"], input[type="text"]{
    width:100%;
    padding:16px 16px 16px 36px;
    font-family:var(--font-mono);
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:#09090b;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  input[type="number"].plain{padding-left:16px;}
  input:focus{border-color:var(--ledger); color:#09090b;}
  input::placeholder{color:#B7BCC3;}

  .contact-select{
    width:100%;
    padding:16px;
    font-family:var(--font-body);
    font-size:15px;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:#09090b;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='8'><path d='M1 1l6 6 6-6' stroke='%235B6472' stroke-width='2' fill='none'/></svg>");
    background-repeat:no-repeat;
    background-position:right 16px center;
  }
  .contact-select:focus{border-color:var(--ledger); color:#09090b;}

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    padding:15px 18px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    background:#09090b;
    color:var(--ink-soft);
    transition:all .15s ease;
    user-select:none;
  }
  .opt:hover{border-color:var(--ledger-soft);}
  .opt.selected{
    background:var(--ledger);
    border-color:var(--ledger); color:#09090b;
    color:#fff;
    font-weight:600;
  }

  .yesno{display:flex; gap:10px;}
  .yesno .opt{flex:1; text-align:center;}

  /* NAV BAR */
  .navbar{
    position:sticky;
    bottom:0;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:16px 24px;
    display:flex;
    gap:12px;
    max-width:600px;
    margin:0 auto;
    width:100%;
  }
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14.5px;
    padding:14px 20px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{
    color:#09090b;
    background:var(--ink);
    color:#09090b;
    flex:1;
  }
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-ghost{
    background:transparent;
    color:var(--slate);
    border:1.5px solid var(--line);
  }
  .btn:disabled{opacity:0.35; cursor:not-allowed;}

  /* INTRO */
  .welcome-block{margin-bottom:22px;}
  .welcome-text{
    font-size:15px;
    line-height:1.65;
    color:var(--ink-soft);
    margin:0 0 20px;
  }
  .welcome-quote{
    border-left:3px solid var(--gold);
    padding:2px 0 2px 16px;
    margin:0;
  }
  .welcome-quote p{
    font-family:var(--font-display);
    font-style:italic;
    font-size:17px;
    color:var(--ink);
    margin:0 0 6px;
    line-height:1.4;
  }
  .welcome-quote span{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--slate);
    letter-spacing:0.03em;
  }

  .intro-card{
    background:#09090b;
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px;
    margin-bottom:16px;
  }
  .intro-card h3{
    font-family:var(--font-display);
    font-size:16px;
    margin:0 0 8px;
  }
  .intro-card p{
    font-size:13.5px;
    color:var(--slate);
    line-height:1.55;
    margin:0;
  }
  .pillar-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0 8px;
  }
  .pillar-chip{
    border:1px solid var(--line);
    background:#09090b;
    border-radius:6px;
    padding:14px;
  }
  .pillar-chip .num{
    font-family:var(--font-mono);
    color:var(--gold);
    font-size:11px;
    font-weight:600;
  }
  .pillar-chip .name{
    font-weight:600;
    font-size:13.5px;
    margin-top:4px;
  }

  /* LOADING */
  .loading-screen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:80px 24px;
    text-align:center;
  }
  .stamp-spin{
    width:64px;height:64px;
    border:3px solid var(--line);
    border-top-color:var(--ledger);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
    margin-bottom:22px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-text{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--slate);
  }

  /* RESULTS */
  .results{padding:28px 24px 60px;}
  .grade-stamp{
    display:flex;
    align-items:center;
    gap:20px;
    background:var(--ink);
    color:#09090b;
    border-radius:10px;
    padding:26px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .grade-stamp::before{
    content:"";
    position:absolute;
    inset:0;
    border:2px solid rgba(200,155,60,0.25);
    border-radius:10px;
    margin:6px;
    pointer-events:none;
  }
  .grade-circle{
    width:84px;height:84px;
    border-radius:50%;
    border:3px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    font-family:var(--font-display);
    font-size:30px;
    font-weight:700;
    color:var(--gold-soft);
  }
  .grade-meta .g-eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:rgba(246,244,238,0.55);
    margin-bottom:6px;
  }
  .grade-meta .g-title{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:600;
    margin-bottom:4px;
  }
  .grade-meta .g-sub{
    font-size:12.5px;
    color:rgba(246,244,238,0.65);
  }

  .pillar-bar-row{margin-bottom:16px;}
  .pillar-bar-head{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
  }
  .pillar-bar-head .pname{font-weight:600;}
  .pillar-bar-head .pscore{font-family:var(--font-mono); color:var(--slate);}
  .bar-track{
    height:8px;
    background:var(--paper-dim);
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{height:100%; border-radius:4px;}

  .report-section{margin-top:30px;}
  .report-section h3{
    font-family:var(--font-display);
    font-size:17px;
    margin:0 0 10px;
  }
  .report-body{
    font-size:14px;
    line-height:1.65;
    color:var(--ink-soft);
    background:#09090b;
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
  }
  .action-list{
    list-style:none;
    padding:0;
    margin:14px 0 0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .action-item{
    display:flex;
    gap:12px;
    background:#09090b;
    border:1px solid var(--line);
    border-left:3px solid var(--ledger);
    border-radius:6px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.5;
  }
  .action-item .num{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--ledger);
    flex-shrink:0;
  }
  .resource-links{
    display:flex;
    flex-wrap:wrap;
    gap:10px 16px;
    margin-top:8px;
  }
  .resource-links a{
    font-size:12px;
    color:var(--ledger);
    text-decoration:none;
    font-weight:600;
    border-bottom:1px solid rgba(31,77,61,0.35);
    padding-bottom:1px;
  }
  .resource-links a:hover{color:var(--ink); border-color:var(--ink);}

  .cta-card{
    background:rgba(200,155,60,0.09);
    border:1px solid rgba(200,155,60,0.35);
    border-radius:8px;
    padding:16px 18px;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink-soft);
  }

  .about-card{
    background:var(--ink);
    color:#09090b;
    border-radius:10px;
    padding:24px;
    margin-top:16px;
  }
  .about-eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-soft);
    margin:0 0 12px;
  }
  .about-name{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .about-bio{
    font-size:13px;
    line-height:1.65;
    color:rgba(246,244,238,0.78);
    margin:0 0 18px;
  }
  .linkedin-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:var(--ink);
    font-weight:600;
    font-size:13px;
    padding:10px 18px;
    border-radius:6px;
    text-decoration:none;
  }
  .linkedin-btn:hover{background:var(--gold-soft);}

  .restart-row{margin-top:30px; text-align:center;}
  .restart-row button{
    background:none;
    border:none;
    color:var(--slate);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    font-family:var(--font-body);
  }

  @media (max-width:400px){
    .pillar-list{grid-template-columns:1fr;}
    .title{font-size:21px;}
    .q-label{font-size:20px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- DATA MODEL ---------------- */
/* Every question carries: label (the question), explain (why/how to answer), example (concrete sample) */

/* Reusable range bands for money questions — easier to answer honestly than exact figures.
   MONEY_BANDS for larger, more variable amounts (revenue, stock spend, cash, debt owed).
   SMALL_MONEY_BANDS for smaller recurring amounts (fixed expenses, monthly repayments). */
const MONEY_BANDS = [
  'Under ₦100,000','₦100,000 – ₦500,000','₦500,001 – ₦1,000,000',
  '₦1,000,001 – ₦3,000,000','₦3,000,001 – ₦10,000,000','Over ₦10,000,000'
];
const MONEY_BAND_VALUES = [50000, 300000, 750000, 2000000, 6500000, 12000000];

const SMALL_MONEY_BANDS = [
  'Under ₦50,000','₦50,000 – ₦200,000','₦200,001 – ₦500,000',
  '₦500,001 – ₦1,000,000','₦1,000,001 – ₦3,000,000','Over ₦3,000,000'
];
const SMALL_MONEY_BAND_VALUES = [25000, 125000, 350000, 750000, 2000000, 4000000];

function moneyBandValue(label){
  let idx = MONEY_BANDS.indexOf(label);
  if(idx !== -1) return MONEY_BAND_VALUES[idx];
  idx = SMALL_MONEY_BANDS.indexOf(label);
  if(idx !== -1) return SMALL_MONEY_BAND_VALUES[idx];
  return 0;
}

const PILLARS = [
  {
    key:'financial', name:'Financial Stability', color:'#22c55e',
    intro:"First, let's look at your finances.",
    desc:'Basic numbers that show whether cash is coming in faster than it goes out.',
    questions:[
      {id:'rev1', label:'What was your revenue 3 months ago?', type:'select', options:MONEY_BANDS,
        explain:'Total money that came INTO the business from sales that month — before subtracting any expenses. Pick the range it falls into. A rough estimate from memory or your sales book is completely fine, no exact figure needed.'},
      {id:'rev2', label:'What was your revenue 2 months ago?', type:'select', options:MONEY_BANDS, group:'rev',
        explain:'Same as before — total sales that month, before any expenses are subtracted.'},
      {id:'rev3', label:'What was your revenue last month?', type:'select', options:MONEY_BANDS, group:'rev',
        explain:'Your most recent full month of sales. This one matters most since it\'s closest to your current reality.'},
      {id:'fixedExp', label:'What are your total fixed monthly expenses?', type:'select', options:SMALL_MONEY_BANDS,
        explain:'Costs that stay roughly the same every month, whether you sell anything or not: rent, staff salaries, electricity or generator fuel, and similar recurring bills. Pick the closest range.'},
      {id:'varExp', label:'How much do you spend buying stock to resell each month?', type:'select', options:MONEY_BANDS,
        explain:'Only the money you spend buying the goods you sell — not rent or salaries (those were the last question). Think about your average spend over the last 3 months.'},
      {id:'cash', label:'How much cash or savings do you have available right now?', type:'select', options:MONEY_BANDS,
        explain:'Only count money you can actually access today — cash in hand, bank balance, or mobile money/POS float. Do NOT include the value of unsold stock sitting on your shelves.'},
      {id:'hasDebt', label:'Do you currently owe any business loans or debt?', type:'yesno',
        explain:'This includes bank loans, cooperative/thrift (ajo/esusu) contributions owed, supplier credit, or money borrowed from family or friends specifically for the business.'},
      {id:'debtAmount', label:'What is the total amount you currently owe?', type:'select', options:MONEY_BANDS, conditional:'hasDebt', showIf:'Yes',
        explain:'The full outstanding balance across all loans and credit, added together. A rough estimate is fine.'},
      {id:'debtRepay', label:'How much do you repay toward this debt each month?', type:'select', options:SMALL_MONEY_BANDS, conditional:'hasDebt', showIf:'Yes',
        explain:'Your total monthly repayment obligation, across all loans combined.'},
      {id:'tracking', label:'How do you currently track income and expenses?', type:'select',
        options:['Nothing / memory','Notebook','Excel or Google Sheets','Accounting software'],
        explain:'Be honest here — this doesn\'t lower your score directly, but it tells us how confident we can be in the numbers you\'ve just given us.'}
    ]
  },
  {
    key:'operational', name:'Operational Excellence', color:'#22c55e',
    intro:"Now let's check how smoothly things run day to day.",
    desc:'How smoothly stock, orders, and customers actually move through the business.',
    questions:[
      {id:'invTrack', label:'How do you track your inventory or stock?', type:'select',
        options:['Memory','Notebook','Excel or Sheets','Inventory software'],
        explain:'Think about how you currently know what\'s in stock and what needs reordering.'},
      {id:'stockouts', label:'In the last 30 days, how many times did you run out of a top-selling item?', type:'select',
        options:['0','1-2','3-5','6+'],
        explain:'Think specifically about your 3-5 most popular items, not everything you sell. Running out of a top seller directly costs you sales.'},
      {id:'overstock', label:"What share of your current stock hasn't sold in the last 60 days?", type:'select',
        options:['0-10%','11-25%','26-50%','50%+'],
        explain:'A rough estimate is fine — you don\'t need an exact count. Think about items that have been sitting for 2 months or more without moving.'},
      {id:'fulfillTime', label:'On average, how long does it take to fulfill an order?', type:'select',
        options:['Same day','1-2 days','3-7 days','1 week+'],
        explain:'Measure from the moment a customer places an order or request, to when they actually receive it.'},
      {id:'repeatPct', label:"What share of last month's customers were repeat buyers?", type:'select',
        options:['0-20%','21-50%','51-80%','80%+'],
        explain:'A repeat customer is someone who has bought from you more than once. Estimate based on faces or names you recognize returning.'}
    ]
  },
  {
    key:'organizational', name:'Organizational Health', color:'#a1a1aa',
    intro:"Next, let's talk about your team.",
    desc:'How dependent the business is on you personally, and how it runs day to day.',
    questions:[
      {id:'staffCount', label:'How many people work in the business, including yourself?', type:'select',
        options:['Just me (1)','2–3 people','4–6 people','7–15 people','16+ people'],
        explain:'Count everyone who regularly works here, part-time or full-time — family helping out counts too.'},
      {id:'rolesDefined', label:'Do written job roles or tasks exist for each staff member?', type:'select',
        options:['Yes, written down','Informally understood','No, roles overlap constantly'],
        explain:'This is about whether each person knows exactly what they\'re responsible for, and whether that\'s written anywhere or just assumed.'},
      {id:'turnover', label:'How many staff have left or been replaced in the last 12 months?', type:'select',
        options:['0','1–2','3–5','6+'],
        explain:'Include anyone who resigned, was let go, or simply stopped showing up.'},
      {id:'trainingDoc', label:'Is there a written process for training a new staff member?', type:'yesno',
        explain:'Even one page of notes on "how we do things here" counts as written. If training only happens by watching/word of mouth, answer No.'},
      {id:'ownerDep', label:'If you were unavailable for 7 days, how would the business run?', type:'select',
        options:['Fully normal','Minor issues','Major disruption','Would likely stop'],
        explain:'Be honest here — this is one of the strongest signs of how "stuck" a business owner is, and it\'s common to score low here. That\'s exactly what this tool is meant to surface.'}
    ]
  },
  {
    key:'trust', name:'Sustainability & Trust', color:'#A8433E',
    intro:"Almost there — let's look at trust and reliability.",
    desc:'How reliable and reputable the business is to staff, suppliers, and its community.',
    questions:[
      {id:'payWritten', label:'Do staff have agreed pay and payment dates in writing?', type:'yesno',
        explain:'Even a text message confirming salary and pay date counts as "in writing" — it doesn\'t need a formal contract.'},
      {id:'supplierFails', label:'In the last 3 months, how many times has a key supplier missed a delivery date?', type:'select',
        options:['0','1-2','3+'],

/* Flatten pillars into an ordered, dependency-aware step list */
function buildSteps(){
  const steps = [];
  PILLARS.forEach((pillar, pIdx)=>{
    let addedIntro = false;
    pillar.questions.forEach(q=>{
      const conditionMet = !q.conditional || answers[q.conditional] === q.showIf;
      if(conditionMet){
        if(!addedIntro){
          steps.push({type:'sectionIntro', pillar, pIdx});
          addedIntro = true;
        }
        steps.push({type:'question', pillar, pIdx, q});
      }
    });
  });
  return steps;
}

function scoreFinancial(a){
  let subs = [];
  // Revenue trend: compare which range band each month falls into (ordinal), since
  // exact figures are no longer collected — this still shows direction of movement.
  const i1 = MONEY_BANDS.indexOf(a.rev1);
  const i2 = MONEY_BANDS.indexOf(a.rev2);
  const i3 = MONEY_BANDS.indexOf(a.rev3);
  let trendScore;
  if(i3 > i2 && i2 > i1) trendScore = 100;
  else if(i3 >= i1) trendScore = 65;
  else trendScore = 25;
  subs.push({label:'Revenue trend', score:trendScore});

  const fixedExp = moneyBandValue(a.fixedExp);
  const varExp = moneyBandValue(a.varExp);
  const cash = moneyBandValue(a.cash);
  const totalExp = fixedExp+varExp;
  const runway = totalExp>0 ? cash/totalExp : 3;
  let runwayScore;
  if(runway < 1) runwayScore = 20;
  else if(runway < 3) runwayScore = 60;
  else runwayScore = 95;
  subs.push({label:'Cash runway', score:runwayScore, detail:`~${runway.toFixed(1)} months (estimated from selected ranges)`});

  let debtScore = 100;
  if(a.hasDebt === 'Yes'){
    const rev3Val = moneyBandValue(a.rev3);
    const debtRepayVal = moneyBandValue(a.debtRepay);
    const ratio = rev3Val>0 ? debtRepayVal/rev3Val : 1;
    if(ratio < 0.1) debtScore = 90;
    else if(ratio < 0.3) debtScore = 60;
    else debtScore = 25;
  }
  subs.push({label:'Debt burden', score:debtScore});

  const trackMap = {'Nothing / memory':20,'Notebook':55,'Excel or Google Sheets':85,'Accounting software':100};
  const trackScore = trackMap[a.tracking] ?? 20;
  subs.push({label:'Financial visibility', score:trackScore});

  const s = (trendScore+runwayScore+debtScore+trackScore)/4;
  return {score:Math.round(s), subs};
}

function scoreOperational(a){
  const invMap = {'Memory':20,'Notebook':55,'Excel or Sheets':85,'Inventory software':100};
  const invScore = invMap[a.invTrack] ?? 20;
  const stockoutMap = {'0':100,'1-2':75,'3-5':45,'6+':15};
  const stockoutScore = stockoutMap[a.stockouts] ?? 50;
  const overstockMap = {'0-10%':100,'11-25%':70,'26-50%':40,'50%+':15};
  const overstockScore = overstockMap[a.overstock] ?? 50;
  const fulfillMap = {'Same day':100,'1-2 days':75,'3-7 days':45,'1 week+':15};
  const fulfillScore = fulfillMap[a.fulfillTime] ?? 50;
  const repeatMap = {'0-20%':15,'21-50%':45,'51-80%':75,'80%+':100};
  const repeatScore = repeatMap[a.repeatPct] ?? 50;

  const subs = [
    {label:'Inventory tracking', score:invScore},
    {label:'Stockout frequency', score:stockoutScore},
    {label:'Overstock level', score:overstockScore},
    {label:'Fulfillment speed', score:fulfillScore},
    {label:'Repeat customers', score:repeatScore}
  ];
  const s = (invScore+stockoutScore+overstockScore+fulfillScore+repeatScore)/5;
  return {score:Math.round(s), subs};
}

function scoreOrganizational(a){
  const rolesMap = {'Yes, written down':100,'Informally understood':60,'No, roles overlap constantly':25};
  const rolesScore = rolesMap[a.rolesDefined] ?? 40;
  const turnoverMap = {'0':100,'1–2':65,'3–5':35,'6+':15};
  const turnoverScore = turnoverMap[a.turnover] ?? 40;
  const trainScore = a.trainingDoc === 'Yes' ? 100 : 30;
  const depMap = {'Fully normal':100,'Minor issues':70,'Major disruption':35,'Would likely stop':10};
  const depScore = depMap[a.ownerDep] ?? 40;

  const subs = [
    {label:'Role clarity', score:rolesScore},
    {label:'Staff stability', score:turnoverScore},
    {label:'Training process', score:trainScore},
    {label:'Owner independence', score:depScore}
  ];
  const s = (rolesScore+turnoverScore+trainScore+depScore)/4;
  return {score:Math.round(s), subs};
}

function scoreTrust(a){
  const payScore = a.payWritten === 'Yes' ? 100 : 30;
  const supMap = {'0':100,'1-2':60,'3+':25};
  const supScore = supMap[a.supplierFails] ?? 50;
  const wasteMap = {'Discard safely':100,'Sell at discount':80,'No consistent method':30,'Discard without process':20};
  const wasteScore = wasteMap[a.wasteHandling] ?? 40;
  const yearsMap = {'Less than 1 year':40,'1–3 years':65,'4–7 years':85,'8+ years':100};
  const yearsScore = yearsMap[a.yearsOperating] ?? 40;

  const subs = [
    {label:'Staff pay clarity', score:payScore},
    {label:'Supplier reliability', score:supScore},
    {label:'Waste handling', score:wasteScore},
    {label:'Track record', score:yearsScore}
  ];
  const s = (payScore+supScore+wasteScore+yearsScore)/4;
  return {score:Math.round(s), subs};
}

function scoreMarketing(a){
  const acqMap = {'Word of mouth only':30,'Social media (organic posts)':55,'Paid ads (social or search)':70,'Referrals/agents':65,'Multiple channels actively':100};
  const acqScore = acqMap[a.acqChannel] ?? 30;
  const socialMap = {'Yes, consistently (weekly+)':100,'Yes, but rarely':55,'No active presence':20};
  const socialScore = socialMap[a.socialActive] ?? 30;
  const trackMap = {'Yes, I ask/track this':100,'Sometimes':55,'No idea':20};
  const trackScore = trackMap[a.trackSource] ?? 30;
  const spendMap = {'0% (nothing)':25,'1-5%':65,'6-15%':100,'15%+':75};
  const spendScore = spendMap[a.marketingSpend] ?? 30;
  const followScore = a.followUp === 'Yes' ? 100 : 30;

  const subs = [
    {label:'Acquisition channels', score:acqScore},
    {label:'Social media presence', score:socialScore},
    {label:'Attribution tracking', score:trackScore},
    {label:'Marketing investment', score:spendScore},
    {label:'Customer follow-up', score:followScore}
  ];
  const s = (acqScore+socialScore+trackScore+spendScore+followScore)/5;
  return {score:Math.round(s), subs};
}

function computeAll(){
  scores.financial = scoreFinancial(answers);
  scores.operational = scoreOperational(answers);
  scores.organizational = scoreOrganizational(answers);
  scores.trust = scoreTrust(answers);
  scores.marketing = scoreMarketing(answers);
}

function letterGrade(avg){
  if(avg >= 90) return 'A+';
  if(avg >= 80) return 'A';
  if(avg >= 70) return 'B';
  if(avg >= 60) return 'C';
  return 'D';
}

function buildActionItems(){
  const all = [];
  PILLARS.forEach(p=>{
    scores[p.key].subs.forEach(sub=>{ all.push({pillar:p.name, ...sub}); });
  });
  all.sort((a,b)=>a.score-b.score);
  const worst = all.slice(0,3);
  return worst.map(w => ({
    text: ACTION_TEMPLATES[w.label] || `Improve ${w.label.toLowerCase()} in ${w.pillar}.`,
    resources: RESOURCES[w.label] || null
  }));
}

async function generateNarrative(overallGrade, overallAvg){
  const summary = PILLARS.map(p=>`${p.name}: ${scores[p.key].score}/100`).join(', ');
  const bizContext = `Business: ${answers.businessName||'unnamed'} (${answers.businessType||'unspecified type'}), located in ${answers.location||'unspecified location'}, Nigeria. Owner: ${answers.ownerName||'unspecified'}.`;
  const prompt = `You are a Fractional Ops & AI Systems Engineer advising a Nigerian SME owner. ${bizContext} Their AI Business Health Scorecard results: Overall grade ${overallGrade} (${overallAvg}/100). Pillar scores: ${summary}. Raw answers: ${JSON.stringify(answers)}.

Write a short (3-4 sentence) plain-English summary of their business health, addressed to the owner by name. Be direct and specific, not generic. No headers, no markdown, just prose. Do not repeat the numbers back verbatim, interpret what they mean for the owner.`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{role:"user", content:prompt}]
      })
    });
    const data = await response.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    if(text) return text;
    throw new Error('empty');
  }catch(e){
    return `This business is sitting at a ${overallGrade} overall. The numbers point to specific, fixable gaps rather than a business in real danger — the action items below target exactly where to focus first.`;
  }
}

    return `<div class="q" style="border-bottom:none; margin-bottom:16px; padding-bottom:0;">

    </div>`;
  }).join('');

  const valid = allContactFieldsValid();

  app.innerHTML = `
    <div class="topbar" style="padding-bottom:0;">
      <p class="eyebrow">Victor K. Okoye</p>

function updateContactContinueState(){
  const btn = document.getElementById('continue-btn');
  if(btn) btn.disabled = !allContactFieldsValid();
}

function setContactAnswer(id, value){
  answers[id] = value;
}

function isAnswered(q){
  const v = answers[q.id];
  return v !== undefined && v !== null && v !== '';
}

function renderSectionIntro(step, steps){
  const {pillar, pIdx} = step;

function renderQuestionStep(steps, idx){
  const {pillar, q} = steps[idx];
  const questionSteps = steps.filter(s => s.type === 'question');
  const questionIdx = questionSteps.indexOf(steps[idx]);
  const val = answers[q.id];
  let field = '';

  if(q.type === 'currency'){
    field = `<div class="currency-wrap"><span>₦</span><input id="input-${q.id}" type="number" inputmode="numeric" placeholder="0"
      value="${val||''}" oninput="setAnswer('${q.id}', this.value)"></div>`;
  } else if(q.type === 'number'){
    field = `<input id="input-${q.id}" type="number" class="plain" inputmode="numeric" placeholder="0"
      value="${val||''}" oninput="setAnswer('${q.id}', this.value)">`;
  } else if(q.type === 'yesno'){
    field = `<div class="yesno">
      <div class="opt ${val==='Yes'?'selected':''}" onclick="selectOpt('${q.id}','Yes')">Yes</div>
      <div class="opt ${val==='No'?'selected':''}" onclick="selectOpt('${q.id}','No')">No</div>
    </div>`;
  } else if(q.type === 'select'){
    field = `<div class="options">
      ${q.options.map(o=>`<div class="opt ${val===o?'selected':''}" onclick="selectOpt('${q.id}','${o.replace(/'/g,"\\'")}')">${o}</div>`).join('')}
    </div>`;
  }

  const canContinue = isAnswered(q);

  app.innerHTML = `
    <div class="topbar" style="padding-bottom:0;">
      <p class="eyebrow">Victor K. Okoye</p>
      <h1 class="title" style="font-size:19px;">Business Health Scorecard</h1>
    </div>
    ${renderProgress(questionIdx, questionSteps.length)}
    <div class="stage">
      <div class="pillar-tag"><span class="dot" style="background:${pillar.color}"></span>${pillar.name}</div>
      <div class="q-number">Q${questionIdx+1}</div>
      <h2 class="q-label">${q.label}</h2>
      ${q.explain?`<p class="q-explain">${q.explain}</p>`:''}
      ${q.example?`<div class="q-example">${q.example}</div>`:''}
      <div class="field-area">${field}</div>
    </div>
    <div class="navbar">
      <button class="btn btn-ghost" onclick="prevStep()">Back</button>
      <button class="btn btn-primary" id="continue-btn" ${canContinue?'':'disabled'} onclick="nextStep()">${idx===steps.length-1?'See my score':'Continue'}</button>
    </div>
  `;

  if(q.type === 'currency' || q.type === 'number'){
    const inputEl = document.getElementById(`input-${q.id}`);
    if(inputEl){
      inputEl.focus();
      inputEl.addEventListener('input', ()=>{
        const btn = document.getElementById('continue-btn');
        if(btn) btn.disabled = !isAnswered(q);
      });
    }
  }
}

function setAnswer(id, value){
  answers[id] = value;
}

function selectOpt(id, value){
  answers[id] = value;
  render(); // re-render current step with selection made; conditional steps recomputed on next()
}

function nextStep(){
  current++;
  const steps = buildSteps();
  if(current >= steps.length){
    render();
    runScoring();
  } else {
    render();

function prevStep(){
  current--;

function buildWhatsAppLink(grade){
  if(!WHATSAPP_NUMBER) return null;
  const msg = `Hi Victor, I'm ${answers.ownerName || 'a business owner'} from ${answers.businessName || 'my business'}. I just completed the Business Health Scorecard (Grade: ${grade || '—'}) and I'd like to talk about next steps.`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

async function submitLead(overallAvg, grade, narrative, actionItems){
  const payload = {
    timestamp: new Date().toISOString(),
    businessName: answers.businessName || '',
    ownerName: answers.ownerName || '',
    whatsapp: answers.whatsapp || '',
    location: answers.location || '',
    businessType: answers.businessType || '',
    email: answers.email || '',
    overallScore: overallAvg,
    grade: grade,
    financial: scores.financial.score,
    operational: scores.operational.score,
    organizational: scores.organizational.score,
    trust: scores.trust.score,
    marketing: scores.marketing.score,
    narrative: narrative,
    actionItems: actionItems.map(a => ({
      text: a.text,
      learnLabel: a.resources ? a.resources.learn.label : '',
      learnUrl: a.resources ? a.resources.learn.url : '',
      helpLabel: a.resources ? a.resources.help.label : '',
      helpUrl: a.resources ? a.resources.help.url : ''
    })),
    answers: JSON.stringify(answers)
  };
  try{
    // text/plain avoids a CORS preflight that Apps Script web apps don't handle by default
    // no-cors is required for Apps Script web apps — they don't return CORS headers,
    // so a normal cross-origin fetch throws "Failed to fetch" even when the request
    // actually succeeds server-side. no-cors trades away the ability to read the
    // response for the ability to actually send the request reliably.
    await fetch(LEAD_CAPTURE_ENDPOINT, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return true;
  }catch(e){
    console.warn('Lead/email submission failed:', e);
    return false;
  }
}

async function runScoring(){
  computeAll();
  const overallAvg = Math.round((scores.financial.score + scores.operational.score + scores.organizational.score + scores.trust.score + scores.marketing.score)/5);
  const grade = letterGrade(overallAvg);
  const actionItems = buildActionItems();
  const narrative = await generateNarrative(grade, overallAvg);

  if(!LEAD_CAPTURE_ENDPOINT){
    // Not configured yet — show results on screen so nothing is lost during setup/testing.
    console.warn('LEAD_CAPTURE_ENDPOINT not set — showing results on screen instead of emailing.');
    renderResults(overallAvg, grade, actionItems, narrative);
    return;
  }

  renderSending();
  const sent = await submitLead(overallAvg, grade, narrative, actionItems);
  renderConfirmation(sent, grade);
}
